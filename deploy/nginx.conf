# Public entry point (PRD §12 Docker Compose shape): TLS, HSTS, caching, and routing to api / web-ssr.
# Terminate TLS here: mount a certificate at /etc/nginx/certs/{fullchain,privkey}.pem (Let's Encrypt or a CDN origin cert).

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  client_max_body_size 12m;            # product image uploads (5 MB each, up to 5 per request)

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/xml;
  gzip_min_length 1024;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  upstream api { server api:8080; keepalive 16; }
  upstream web { server web:4000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Login / OTP endpoints get a much tighter limit than the rest of the API (the API enforces its own too).
    location ~ ^/api/v[0-9]+/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://api;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
    }

    location /health { proxy_pass http://api; allow 127.0.0.1; allow 172.16.0.0/12; deny all; }

    # Uploaded product images: immutable file names, so cache hard.
    location /uploads/ {
      proxy_pass http://api;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Everything else is the server-rendered storefront.
    location / {
      proxy_pass http://web;
    }
  }
}
